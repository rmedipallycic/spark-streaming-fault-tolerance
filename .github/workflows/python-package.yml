name: Reproduce paper tables

# Regenerates every table of the paper from the committed trial records and
# fails if anything differs from what is committed (no Spark or Kafka needed).
on: [push, pull_request]

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate the paper's tables from experiments/
        run: python paper/make_tables.py
      - name: Check they match the committed tables
        run: git diff --exit-code -- paper/tables
